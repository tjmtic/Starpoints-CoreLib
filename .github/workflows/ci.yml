name: CI

# Order is the fleet's: format first (cheapest, and nobody should have to read a log for it),
# then project rules + lint, tests, and the iOS checks. This repo is public, so the macOS lane
# is free and runs on every PR: an iOS-only failure is caught before the studio merges.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - uses: gradle/actions/setup-gradle@v4
      - name: Format (ktfmt)
        run: ./gradlew ktfmtCheck --console=plain
      - name: Project rules + detekt
        run: ./gradlew :detekt-rules:test detekt --console=plain
      - name: Core tests (JVM)
        run: ./gradlew :core-lib:jvmTest --console=plain
      - name: Core tests (Android unit)
        run: ./gradlew :core-lib:testDebugUnitTest --console=plain
      - name: iOS compile check (klib cross-compilation)
        run: ./gradlew :core-lib:compileKotlinIosSimulatorArm64 -Pkotlin.native.enableKlibsCrossCompilation=true --console=plain

  ios:
    name: iOS (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (iOS simulator)
        run: ./gradlew :core-lib:iosSimulatorArm64Test --console=plain

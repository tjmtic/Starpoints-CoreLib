name: Release

# A vX.Y.Z tag publishes com.abyxcz.starpoints.core:core-lib:X.Y.Z to GitHub Packages.
# Package versions are immutable there, so everything is built to mavenLocal first: a failure
# stops before anything is uploaded.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (X.Y.Z)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # macOS: the iOS artifacts are built by Kotlin/Native on Apple hosts.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"
      - name: Build every publication (compile gate)
        run: ./gradlew :core-lib:publishToMavenLocal -PlibVersion=${{ steps.v.outputs.version }} --console=plain
      - name: Publish to GitHub Packages
        run: ./gradlew :core-lib:publishAllPublicationsToGitHubPackagesRepository -PlibVersion=${{ steps.v.outputs.version }} --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Layered on detekt's default config (buildUponDefaultConfig). Zero issues; never add a
# baseline to get past a finding (kmp-agentic-sdlc .claude/docs/kotlin-style.md rule 3).
build:
  maxIssues: 0

style:
  MagicNumber:
    # Astronomy is published coefficients (Meeus, Astronomical Algorithms): naming each term of
    # a series adds nothing but noise. Outside math/ the rule stands; tests are excluded by default.
    excludes: ['**/commonTest/**', '**/jvmTest/**', '**/iosTest/**', '**/core/math/**']

naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']

# :detekt-rules — the fleet's project rules.
fleet:
  ForbiddenNotNullAssertion:
    active: true
